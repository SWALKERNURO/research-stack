name: Security
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  scans:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: python -m pip install pip-audit==2.10.1 bandit==1.9.4
      - run: pip-audit -r requirements-lock.txt --disable-pip --no-deps --format json --output pip-audit.json
      - run: npm ci && npm audit --audit-level=low --json > npm-audit.json
      - run: bandit -r packages services -f json -o bandit.json
      - run: python scripts/security_tools.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: security-evidence
          path: |
            pip-audit.json
            npm-audit.json
            bandit.json
            gitleaks.json
          retention-days: 30
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
