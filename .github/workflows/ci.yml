name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-lock.txt pytest-cov==7.1.0 build==1.6.1
      - run: python -m pip install -e . --no-deps
      - run: npm ci
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: npm run format:check
      - run: npm run check
      - run: python -m pytest -q --cov --cov-report=xml --junitxml=python-tests.xml
      - run: npm test -- --reporter=json --outputFile=frontend-tests.json
      - run: npm run build
      - run: python -m build
      - name: Verify wheel migrations outside source
        run: |
          python -m venv /tmp/nrs-wheel
          /tmp/nrs-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/nrs-wheel/bin/nx-stack --database sqlite:////tmp/nrs-wheel.sqlite init
      - name: Smoke-test versioned release packaging
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: unit-and-build-evidence
          path: |
            python-tests.xml
            frontend-tests.json
            coverage.xml
            dist/
          retention-days: 30
