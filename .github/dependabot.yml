version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      vite-toolchain:
        patterns:
          - vite
          - "@vitejs/plugin-react"
          - vitest
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      pydantic:
        patterns:
          - pydantic
          - pydantic-core
          - pydantic_core
          - typing-inspection
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql:
        patterns:
          - github/codeql-action/*
