[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nurowerx-research-stack"
version = "0.1.1"
description = "TRACE, LOOP, LENS and FRAME: a local, evidence-linked research workbench"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Spencer H. Walker"}]
dependencies = ["fastapi==0.162.2", "uvicorn==0.54.0", "SQLAlchemy==2.1.8", "alembic==1.20.1", "pydantic==2.14.3", "numpy==2.4.6", "psutil==7.2.2"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.17.4"]
research = ["scipy==1.17.1"]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
nx-stack = "nx_api.cli:main"

[tool.setuptools]
packages = ["nx_schema", "nx_trace", "nx_loop", "nx_adapters", "nx_api", "nx_api.migrations", "nx_api.migrations.versions"]
package-dir = {nx_schema = "packages/shared-schemas/src/nx_schema", nx_trace = "packages/nx-trace/src/nx_trace", nx_loop = "packages/nx-loop/src/nx_loop", nx_adapters = "packages/integration-adapters/src/nx_adapters", nx_api = "services/research-api/src/nx_api"}

[tool.setuptools.package-data]
nx_api = ["migrations/*.py", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.coverage.run]
source = ["nx_trace", "nx_loop", "nx_schema", "nx_adapters", "nx_api"]

[tool.coverage.report]
show_missing = true

